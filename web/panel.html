<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  html.theme-dark {
    --card-bg: linear-gradient(160deg, rgba(28,28,33,.92), rgba(16,16,19,.94));
    --card-border: rgba(255,255,255,.13);
    --text: #f2f2f4; --text-dim: #9ba0a8;
    --bar-track: rgba(255,255,255,.10);
    --btn-bg: rgba(255,255,255,.08); --btn-hover: rgba(255,255,255,.16);
    --accent: #fafafa;
    --accent-fill: linear-gradient(90deg, #e4e4e7, #fafafa);
    --accent-glow: rgba(255,255,255,.30);
  }
  html.theme-light {
    --card-bg: linear-gradient(160deg, rgba(255,255,255,.94), rgba(243,245,249,.95));
    --card-border: rgba(15,23,42,.10);
    --text: #1f2430; --text-dim: #6b7280;
    --bar-track: rgba(32,36,46,.10);
    --btn-bg: rgba(32,36,46,.07); --btn-hover: rgba(32,36,46,.14);
    --accent: #0a0a0a;
    --accent-fill: linear-gradient(90deg, #3f3f46, #0a0a0a);
    --accent-glow: rgba(0,0,0,.28);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:transparent; overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; user-select:none; }
  #wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:12px; }

  #card {
    width: 100%; border-radius: 18px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: 0 18px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
    padding: 16px 16px 12px;
    color: var(--text);
    opacity: 0; transform: scale(.7); transform-origin: var(--anchor, 50% 50%);
  }
  #card.enter { animation: springIn .38s cubic-bezier(.34,1.56,.64,1) forwards; }
  #card.exit  { animation: shrinkOut .18s ease-in forwards; }
  @keyframes springIn {
    from { opacity:0; transform: scale(.7) translateY(10px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }
  @keyframes shrinkOut {
    to { opacity:0; transform: scale(.72) translateY(6px); }
  }

  .row { display:flex; align-items:center; }
  .head { justify-content: space-between; margin-bottom: 12px; }
  .title { font-size: 17px; font-weight: 700; letter-spacing:.2px; display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px;
    background: var(--btn-bg); border:1px solid var(--card-border); color: var(--text-dim); }
  .icons { display:flex; gap:6px; }
  .icon-btn {
    width:26px; height:26px; border-radius:8px; border:none; cursor:pointer;
    background: var(--btn-bg); color: var(--text-dim);
    font-size:13px; display:flex; align-items:center; justify-content:center;
    transition: background .15s, transform .15s, color .15s;
  }
  .icon-btn:hover { background: var(--btn-hover); color: var(--text); transform: translateY(-1px); }
  .icon-btn.active { color: var(--accent); }
  .icon-btn:active { transform: scale(.92); }

  .quota { margin: 10px 0 14px; }
  .quota .lbl { justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
  .quota .lbl .name { color: var(--text-dim); }
  .quota .lbl .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 9px; border-radius: 5px; background: var(--bar-track); overflow: hidden; position: relative; }
  .bar .fill {
    height:100%; border-radius:5px; width:0%;
    background: var(--accent-fill);
    transition: width .7s cubic-bezier(.34,1.3,.4,1), background .4s;
    box-shadow: 0 0 8px var(--accent-glow);
  }
  .bar .fill.warn { background: linear-gradient(90deg,#f59e0b,#fbbf24); box-shadow:0 0 8px rgba(251,191,36,.4);}
  .bar .fill.bad  { background: linear-gradient(90deg,#ef4444,#f87171); box-shadow:0 0 8px rgba(248,113,113,.4);}
  .reset { font-size: 10.5px; color: var(--text-dim); margin-top: 4px; text-align: right; }

  .balance {
    margin: 6px 0 10px; padding: 12px 14px; border-radius: 12px;
    background: var(--btn-bg); border: 1px solid var(--card-border);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .balance .lbl { font-size: 12px; color: var(--text-dim); }
  .balance .amt { font-size: 24px; font-weight: 800; letter-spacing:.3px; color: var(--accent); font-variant-numeric: tabular-nums; }

  .meta { font-size: 10.5px; color: var(--text-dim); display:flex; justify-content:space-between; margin-top:2px; }
  .err-line { font-size: 11px; color: var(--accent-red, #f87171); margin-top: 6px; }

  /* settings drawer */
  #settings { max-height: 0; overflow: hidden; transition: max-height .35s cubic-bezier(.4,0,.2,1), margin .3s; margin-top:0; }
  #settings.open { max-height: 320px; margin-top: 10px; }
  .set-row { display:flex; align-items:center; justify-content:space-between; padding: 6px 2px; font-size: 12px; }
  .set-row + .set-row { border-top: 1px solid var(--card-border); }
  .seg { display:flex; background: var(--bar-track); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button {
    border:none; background:transparent; color:var(--text-dim); font-size:11px;
    padding: 4px 9px; border-radius:6px; cursor:pointer; transition: all .15s;
  }
  .seg button.on { background: var(--btn-hover); color: var(--text); font-weight:600; }
  .quit { width:100%; margin-top:8px; padding:7px; border-radius:9px; border:1px solid var(--card-border);
    background: var(--btn-bg); color: var(--text-dim); font-size:12px; cursor:pointer; }
  .quit:hover { color:#f87171; background: rgba(248,113,113,.12); }
</style>
</head>
<body>
<div id="wrap"><div id="card">
  <div class="row head">
    <div class="title"><span id="t-app">Devin</span><span class="badge" id="plan"></span></div>
    <div class="icons">
      <button class="icon-btn" id="b-lang" title="中/EN">文</button>
      <button class="icon-btn" id="b-pin" title="Pin">📌</button>
      <button class="icon-btn" id="b-refresh" title="Refresh">⟳</button>
      <button class="icon-btn" id="b-gear" title="Settings">⚙</button>
    </div>
  </div>

  <div class="quota" id="q-daily">
    <div class="row lbl"><span class="name" id="t-daily">每日配额</span><span class="val" id="v-daily"></span></div>
    <div class="bar"><div class="fill" id="f-daily"></div></div>
    <div class="reset" id="r-daily"></div>
  </div>
  <div class="quota" id="q-weekly">
    <div class="row lbl"><span class="name" id="t-weekly">每周配额</span><span class="val" id="v-weekly"></span></div>
    <div class="bar"><div class="fill" id="f-weekly"></div></div>
    <div class="reset" id="r-weekly"></div>
  </div>

  <div class="balance">
    <span class="lbl" id="t-balance">额外余额</span>
    <span class="amt" id="v-balance">—</span>
  </div>

  <div class="meta"><span id="period"></span><span id="updated"></span></div>
  <div class="err-line" id="errline" style="display:none"></div>

  <div id="settings">
    <div class="set-row"><span id="t-s-pin">双击悬浮球 → 面板置顶</span>
      <div class="seg" data-k="dblclick_pin"><button data-v="true" id="s-pin-on">开</button><button data-v="false">关</button></div></div>
    <div class="set-row"><span id="t-s-ring">配额环显示</span>
      <div class="seg" data-k="ring_mode"><button data-v="left" id="s-ring-left">剩余</button><button data-v="used">已用</button></div></div>
    <div class="set-row"><span id="t-s-src">配额环数据源</span>
      <div class="seg" data-k="ring_source"><button data-v="auto" id="s-src-auto">自动</button><button data-v="daily">每日</button><button data-v="weekly">每周</button></div></div>
    <div class="set-row"><span id="t-s-theme">主题</span>
      <div class="seg" data-k="theme"><button data-v="follow">跟随OU</button><button data-v="light">浅</button><button data-v="dark">深</button></div></div>
    <div class="set-row"><span id="t-s-refresh">自动刷新</span>
      <div class="seg" data-k="refresh_secs"><button data-v="300">5m</button><button data-v="600">10m</button><button data-v="3000">50m</button></div></div>
    <div class="set-row"><span id="t-s-login">开机自启</span>
      <div class="seg" data-k="start_on_login"><button data-v="true">开</button><button data-v="false">关</button></div></div>
    <div class="set-row"><span id="t-s-devin">随 Devin 启动</span>
      <div class="seg" data-k="devin_hook"><button data-v="true">开</button><button data-v="false">关</button></div></div>
    <button class="quit" id="b-quit">退出悬浮球</button>
  </div>
</div></div>

<script>
const I18N = {
  zh: { app:'Devin', daily:'每日配额', weekly:'每周配额', balance:'额外余额',
        left:'剩余', used:'已用', resets:'后重置', noReset:'', updated:'更新于',
        sPin:'双击悬浮球 → 面板置顶', sRing:'配额环显示', sSrc:'配额环数据源',
        sTheme:'主题', sLogin:'开机自启', sDevin:'随 Devin 启动', sRefresh:'自动刷新',
        quit:'退出悬浮球', on:'开', off:'关',
        auto:'自动', dailyS:'每日', weeklyS:'每周', follow:'跟随OU', light:'浅', dark:'深',
        errAuth:'未登录 Devin — 请先登录 Devin Desktop', errNet:'获取数据失败，点 ⟳ 重试',
        periodFmt:(a,b)=>`计费周期 ${a} → ${b}` },
  en: { app:'Devin', daily:'Daily quota', weekly:'Weekly quota', balance:'Extra balance',
        left:'left', used:'used', resets:'', noReset:'', updated:'Updated',
        sPin:'Double-click orb pins panel', sRing:'Ring shows', sSrc:'Ring source',
        sTheme:'Theme', sLogin:'Start on login', sDevin:'Launch with Devin', sRefresh:'Auto refresh',
        quit:'Quit orb', on:'On', off:'Off',
        auto:'Auto', dailyS:'Daily', weeklyS:'Weekly', follow:'OU', light:'Light', dark:'Dark',
        errAuth:'Not signed in to Devin — sign in to Devin Desktop first', errNet:'Failed to fetch. Press ⟳ to retry',
        periodFmt:(a,b)=>`Billing cycle ${a} → ${b}` },
};
let lang = 'zh', state = null, pinned = false;

const $ = id => document.getElementById(id);
const T = k => I18N[lang][k];
let bridge = null;
const api = m => (...a) => bridge && bridge[m](...a);

window.setTheme = t => {
  document.documentElement.className = t === 'dark' ? 'theme-dark' : 'theme-light';
};
window.setAnchor = a => document.getElementById('card').style.setProperty('--anchor', a);
window.playEnter = () => { const c=$('card'); c.classList.remove('exit'); c.classList.add('enter'); };
window.playExit = () => { const c=$('card'); c.classList.remove('enter'); c.classList.add('exit'); };

function fmtReset(unix) {
  if (!unix) return '';
  const s = Math.max(0, Math.floor(unix - Date.now()/1000));
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  const rel = d>0 ? `${d}d ${h}h` : h>0 ? `${h}h ${m}m` : `${m}m`;
  return lang==='zh' ? `${rel} 后重置` : `Resets in ${rel}`;
}
function fmtUpdated(ts) {
  if (!ts) return '';
  const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  return `${T('updated')} ${s<60 ? s+'s' : Math.floor(s/60)+'m'} ago`;
}
function fmtDate(s) { return s ? s.slice(0,10) : '—'; }

function setBar(prefix, leftPct, reset) {
  const usedMode = state && state.ringShown === 'used';
  const shown = leftPct == null ? null : (usedMode ? 100-leftPct : leftPct);
  const row = $('q-'+prefix);
  if (shown == null) { row.style.display='none'; return; }
  row.style.display='';
  const f = $('f-'+prefix);
  f.style.width = Math.max(0,Math.min(100,shown)) + '%';
  f.className = 'fill' + (shown>=50?'':shown>=20?' warn':' bad');
  $('v-'+prefix).textContent = Math.round(shown) + '% ' + T(usedMode?'used':'left');
  $('r-'+prefix).textContent = fmtReset(reset);
}

window.updateState = s => {
  state = s; lang = s.lang || 'zh'; pinned = !!s.pinned;
  $('b-pin').classList.toggle('active', pinned);
  document.querySelectorAll('#settings .seg').forEach(seg => {
    const k = seg.dataset.k, v = String(s.settings[k]);
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  });
  // i18n
  const i = I18N[lang];
  $('t-daily').textContent=i.daily; $('t-weekly').textContent=i.weekly;
  $('t-balance').textContent=i.balance; $('b-quit').textContent=i.quit;
  $('t-s-pin').textContent=i.sPin; $('t-s-ring').textContent=i.sRing;
  $('t-s-src').textContent=i.sSrc; $('t-s-theme').textContent=i.sTheme;
  $('t-s-login').textContent=i.sLogin; $('t-s-devin').textContent=i.sDevin;
  $('t-s-refresh').textContent=i.sRefresh;
  $('plan').textContent = s.plan || '';
  // data
  if (s.error) {
    $('errline').style.display='';
    $('errline').textContent = s.error === 'auth' ? i.errAuth : i.errNet;
  } else $('errline').style.display='none';
  setBar('daily',  s.daily_left,  s.daily_reset);
  setBar('weekly', s.weekly_left, s.weekly_reset);
  $('v-balance').textContent = s.overage_usd == null ? '—' : '$' + s.overage_usd.toFixed(2);
  $('period').textContent = i.periodFmt(fmtDate(s.period_start), fmtDate(s.period_end));
  $('updated').textContent = fmtUpdated(s.fetched_at);
};

/* interactions */
$('b-pin').onclick    = () => api('toggle_pin')();
$('b-refresh').onclick= () => api('refresh_now')();
$('b-gear').onclick   = () => $('settings').classList.toggle('open');
$('b-lang').onclick   = () => api('set_language')(lang === 'zh' ? 'en' : 'zh');
$('b-quit').onclick   = () => api('quit_app')();
document.querySelectorAll('#settings .seg button').forEach(b => {
  b.onclick = () => api('set_setting')(b.parentElement.dataset.k, b.dataset.v);
});

let hadFocus = false;
window.addEventListener('focus', () => { hadFocus = true; });
window.addEventListener('blur', () => {
  if (hadFocus && bridge) {
    hadFocus = false;
    bridge.panel_blur();
  }
});

/* QWebChannel bridge up -> tell Python we're ready for state */
new QWebChannel(qt.webChannelTransport, ch => {
  bridge = ch.objects.bridge;
  bridge.panel_ready();
});
setInterval(() => { if (state) updateState(state); }, 30000); // refresh countdowns
</script>
</body>
</html>
